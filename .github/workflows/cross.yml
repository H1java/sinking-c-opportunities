name: build-cross
on:
  push:
    paths:
      - 'cross_data.py'
      - 'cross_build.py'
      - '.github/workflows/cross.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python cross_build.py
      - name: Commit generated cross report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/
          git commit -m 'generated 最新变量交叉创新报告' || echo 'no changes'
          git push
